<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" style="background: linear-gradient(135deg, #1e293b 0%, #334155 50%, #475569 100%);">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="compressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="urlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>

    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; }
    }
    @keyframes arrowDash {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes buttonPulse {
      0%, 70%, 100% { fill: #22c55e; }
      75%, 85% { fill: #16a34a; }
    }
    @keyframes checkShow {
      0%, 70% { opacity: 0; transform: scale(0); }
      75%, 90% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1); }
    }
    @keyframes sharePulse {
      0%, 100% { r: 6; opacity: 0.6; }
      50% { r: 8; opacity: 1; }
    }
    .step-box { animation: pulse 3s ease-in-out infinite; }
    .step-1 { animation-delay: 0s; }
    .step-2 { animation-delay: 0.5s; }
    .step-3 { animation-delay: 1s; }
    .arrow-line { animation: arrowDash 1s linear infinite; }
    .copy-btn { animation: buttonPulse 4s ease-in-out infinite; }
    .check-mark { animation: checkShow 4s ease-in-out infinite; }
    .share-icon { animation: sharePulse 2s ease-in-out infinite; }
  </style>

  <!-- 标题 -->
  <text x="450" y="35" text-anchor="middle" fill="#f1f5f9" font-family="Arial, sans-serif" font-size="20" font-weight="bold">
    Markdown-in-URL 工作流程
  </text>

  <!-- 步骤1: 编辑器 -->
  <g class="step-box step-1" filter="url(#shadow)">
    <rect x="40" y="60" width="200" height="140" rx="12" fill="url(#boxGradient)" opacity="0.95"/>
    <!-- 编辑器视觉 -->
    <rect x="55" y="80" width="170" height="6" rx="3" fill="#a5b4fc"/>
    <rect x="55" y="95" width="140" height="6" rx="3" fill="#c7d2fe"/>
    <rect x="55" y="110" width="120" height="6" rx="3" fill="#c7d2fe"/>
    <rect x="55" y="125" width="100" height="6" rx="3" fill="#c7d2fe"/>
    <rect x="55" y="140" width="150" height="6" rx="3" fill="#818cf8"/>
    <rect x="55" y="155" width="80" height="6" rx="3" fill="#c7d2fe"/>
    <text x="140" y="185" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">1. 编辑 Markdown</text>
  </g>

  <!-- 箭头1 -->
  <g>
    <line x1="245" y1="130" x2="295" y2="130" stroke="url(#arrowGradient)" stroke-width="3" stroke-linecap="round" class="arrow-line" stroke-dasharray="10,10"/>
    <polygon points="290,125 300,130 290,135" fill="#3b82f6"/>
  </g>

  <!-- 步骤2: 压缩 -->
  <g class="step-box step-2" filter="url(#shadow)">
    <rect x="300" y="60" width="160" height="140" rx="12" fill="url(#compressGradient)" opacity="0.95"/>
    <text x="380" y="100" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="bold">LZString</text>
    <text x="380" y="125" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12">压缩编码</text>
    <!-- 压缩图标 -->
    <circle cx="380" cy="155" r="20" fill="rgba(255,255,255,0.2)"/>
    <text x="380" y="160" text-anchor="middle" fill="#fff" font-size="16">🗜️</text>
    <text x="380" y="185" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="11">压缩率 60-80%</text>
  </g>

  <!-- 箭头2 -->
  <g>
    <line x1="465" y1="130" x2="515" y2="130" stroke="url(#arrowGradient)" stroke-width="3" stroke-linecap="round" class="arrow-line" stroke-dasharray="10,10" style="animation-delay: 0.3s"/>
    <polygon points="510,125 520,130 510,135" fill="#3b82f6"/>
  </g>

  <!-- 步骤3: 生成URL -->
  <g class="step-box step-3" filter="url(#shadow)">
    <rect x="520" y="60" width="240" height="140" rx="12" fill="url(#urlGradient)" opacity="0.95"/>
    <text x="640" y="90" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="bold">3. 生成分享链接</text>
    <!-- URL展示框 -->
    <rect x="540" y="105" width="200" height="28" rx="6" fill="rgba(255,255,255,0.2)"/>
    <text x="550" y="124" font-family="monospace" font-size="10" fill="#fff">https://md.in/?data=eNrz...</text>
    <!-- 复制按钮 -->
    <rect x="620" y="145" width="60" height="24" rx="6" class="copy-btn" fill="#22c55e"/>
    <text x="650" y="161" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">复制</text>
    <!-- 复选标记 -->
    <g class="check-mark">
      <circle cx="695" cy="157" r="10" fill="#22c55e"/>
      <path d="M690 157 L693 160 L698 154" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 数据流动画 - 从编辑器到URL生成框 -->
  <g class="data-flow">
    <circle r="5" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="4s" repeatCount="indefinite" path="M 140 130 L 380 130 L 640 130"/>
    </circle>
  </g>

  <!-- 分享流程 -->
  <g>
    <!-- 分享路径 -->
    <path d="M 640 210 Q 640 240 450 240 Q 140 240 140 210" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,4" opacity="0.5"/>
    <!-- 分享图标 -->
    <circle cx="450" cy="235" r="8" fill="#22d3ee" class="share-icon" filter="url(#glow)"/>
    <text x="450" y="239" text-anchor="middle" fill="#fff" font-size="10">📤</text>
    <text x="450" y="260" text-anchor="middle" fill="#22d3ee" font-family="Arial, sans-serif" font-size="12">分享链接</text>
  </g>

  <!-- 接收者区域 -->
  <g>
    <rect x="40" y="275" width="820" height="35" rx="8" fill="rgba(255,255,255,0.08)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="450" y="298" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13">
      接收者打开链接 · 无需登录 · 无需注册 · 即开即用
    </text>
  </g>

  <!-- 特性标签 -->
  <g>
    <rect x="50" y="325" width="75" height="18" rx="4" fill="rgba(99,102,241,0.3)" stroke="#6366f1" stroke-width="1"/>
    <text x="87" y="338" text-anchor="middle" fill="#818cf8" font-family="Arial, sans-serif" font-size="9">🔗 URL分享</text>

    <rect x="130" y="325" width="75" height="18" rx="4" fill="rgba(245,158,11,0.3)" stroke="#f59e0b" stroke-width="1"/>
    <text x="167" y="338" text-anchor="middle" fill="#fbbf24" font-family="Arial, sans-serif" font-size="9">🗜️ 高压缩</text>

    <rect x="210" y="325" width="75" height="18" rx="4" fill="rgba(6,182,212,0.3)" stroke="#06b6d4" stroke-width="1"/>
    <text x="247" y="338" text-anchor="middle" fill="#22d3ee" font-family="Arial, sans-serif" font-size="9">🌐 纯前端</text>

    <rect x="290" y="325" width="75" height="18" rx="4" fill="rgba(139,92,246,0.3)" stroke="#8b5cf6" stroke-width="1"/>
    <text x="327" y="338" text-anchor="middle" fill="#a78bfa" font-family="Arial, sans-serif" font-size="9">🔒 无需后端</text>

    <rect x="370" y="325" width="75" height="18" rx="4" fill="rgba(34,197,94,0.3)" stroke="#22c55e" stroke-width="1"/>
    <text x="407" y="338" text-anchor="middle" fill="#4ade80" font-family="Arial, sans-serif" font-size="9">⚡ 即开即用</text>
  </g>
</svg>
