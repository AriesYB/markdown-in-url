# 部署 Vite + React 项目到 GitHub Pages
name: Deploy to GitHub Pages

on:
  # 推送到 master 分支时触发
  push:
    branches: ['master']
  # 允许在 Actions 标签页手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限以允许部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署
concurrency:
  group: 'pages'
  cancel-in-progress: true  # 建议改为 true，避免排队

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史，有助于某些依赖

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build with Vite
        run: npm run build
        env:
          # 确保 BASE_URL 被正确设置
          VITE_BASE_URL: /markdown-in-url/
          # 如果使用其他构建变量也可以在这里设置
          # NODE_ENV: production

      - name: 处理 SPA 路由问题（可选）
        run: |
          # 为客户端路由创建 404.html 副本
          cp ./dist/index.html ./dist/404.html
        # 这个步骤可以解决 GitHub Pages 刷新页面时的 404 问题

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传 Vite 构建输出目录
          path: ./dist

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4