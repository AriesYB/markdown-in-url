<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 在线预览</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
    <!-- 代码高亮样式 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <!-- Markdown 解析 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <!-- Mermaid 图表渲染 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
    <!-- 代码高亮 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 数据压缩（LZString） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- 预设模板 -->
    <script src="templates/examples.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1 class="logo">📝 Markdown 在线预览</h1>
        </div>
        <div class="header-right">
          <button class="btn btn-secondary" id="modeToggle" title="切换模式">
            <span class="icon">👁️</span> <span id="modeText">预览</span>
          </button>
          <button class="btn btn-secondary" id="themeToggle" title="切换主题">
            <span class="icon">☀️</span>
          </button>
          <button
            class="btn btn-secondary"
            id="loadTemplate"
            title="加载示例模板"
          >
            <span class="icon">📋</span> 模板
          </button>
          <button class="btn btn-secondary" id="clearBtn" title="清空内容">
            <span class="icon">🗑️</span> 清空
          </button>
          <button class="btn btn-secondary" id="exportHtml" title="导出 HTML">
            <span class="icon">📄</span> 导出 HTML
          </button>
          <button
            class="btn btn-primary"
            id="shareLink"
            title="生成并复制分享链接"
          >
            <span class="icon">🔗</span> 分享链接
          </button>
          <a
            href="https://github.com/AriesYB/markdown-in-url"
            target="_blank"
            class="btn btn-secondary github-link"
            title="GitHub 仓库"
          >
            <svg class="github-icon" viewBox="0 0 16 16" width="16" height="16">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
          </a>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main">
        <!-- Editor -->
        <div class="editor-container">
          <div class="panel-header">
            <span class="panel-title">编辑器</span>
            <span class="char-count" id="charCount">0 字符</span>
          </div>
          <div class="editor-wrapper">
            <div class="line-numbers" id="lineNumbers"></div>
            <textarea
              id="editor"
              class="editor"
              placeholder="在此输入 Markdown 内容..."
              spellcheck="false"
            ></textarea>
            <!-- 自动补全弹出框 -->
            <div id="autocomplete" class="autocomplete hidden"></div>
          </div>
        </div>

        <!-- Preview -->
        <div class="preview-container">
          <div class="panel-header">
            <span class="panel-title">预览</span>
          </div>
          <div id="preview" class="preview"></div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-info">
          <span>快捷键: Ctrl+S 保存到本地 | Ctrl+Enter 刷新预览</span>
        </div>
      </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Template Modal -->
    <div id="templateModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>选择模板</h2>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="template-list" id="templateList"></div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
