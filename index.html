<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 在线预览</title>
    <link rel="icon" href="img/icon.svg" />
    <link rel="stylesheet" href="css/style.css" />
    <!-- 代码高亮样式 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <!-- Markdown 解析 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <!-- Mermaid 图表渲染 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
    <!-- 代码高亮 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 数据压缩（LZString） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- 预设模板 -->
    <script src="templates/examples.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1 class="logo">
            <img
              src="img/icon.svg"
              alt="logo"
              width="32"
              height="32"
              style="vertical-align: middle; margin-right: 8px"
            />
            Markdown 在线预览
          </h1>
        </div>
        <div class="header-right">
          <button class="btn btn-secondary" id="modeToggle" title="切换模式">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button class="btn btn-secondary" id="themeToggle" title="切换主题">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
          </button>
          <button
            class="btn btn-secondary"
            id="loadTemplate"
            title="加载示例模板"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="18" height="18" x="3" y="3" rx="2" ry="2" />
              <line x1="3" x2="21" y1="9" y2="9" />
              <path d="m9 16 3-3 3 3" />
            </svg>
          </button>
          <button class="btn btn-secondary" id="clearBtn" title="清空内容">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 6h18" />
              <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
              <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
            </svg>
          </button>
          <button class="btn btn-secondary" id="exportHtml" title="导出 HTML">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" x2="8" y1="13" y2="13" />
              <line x1="16" x2="8" y1="17" y2="17" />
              <line x1="10" x2="8" y1="9" y2="9" />
            </svg>
          </button>
          <button
            class="btn btn-secondary"
            id="shareLink"
            title="生成并复制分享链接"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="none"
              stroke="url(#linkGradient)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <defs>
                <linearGradient
                  id="linkGradient"
                  x1="0%"
                  y1="0%"
                  x2="100%"
                  y2="100%"
                >
                  <stop
                    offset="0%"
                    style="stop-color: #22d3ee; stop-opacity: 1"
                  />
                  <stop
                    offset="100%"
                    style="stop-color: #3b82f6; stop-opacity: 1"
                  />
                </linearGradient>
              </defs>
              <path
                d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
              />
              <path
                d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
              />
            </svg>
          </button>
          <a
            href="https://github.com/AriesYB/markdown-in-url"
            target="_blank"
            class="btn btn-secondary github-link"
            title="GitHub 仓库"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              width="16"
              height="16"
              fill="currentColor"
            >
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
          </a>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main">
        <!-- Editor -->
        <div class="editor-container">
          <div class="panel-header">
            <span class="panel-title">编辑器</span>
            <span class="char-count" id="charCount">0 字符</span>
          </div>
          <div class="editor-wrapper">
            <div class="line-numbers" id="lineNumbers"></div>
            <textarea
              id="editor"
              class="editor"
              placeholder="在此输入 Markdown 内容..."
              spellcheck="false"
            ></textarea>
            <!-- 自动补全弹出框 -->
            <div id="autocomplete" class="autocomplete hidden"></div>
          </div>
        </div>

        <!-- Preview -->
        <div class="preview-container">
          <div class="panel-header">
            <button
              class="btn btn-secondary toc-toggle"
              id="tocToggle"
              title="显示/隐藏目录"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="4" x2="20" y1="6" y2="6" />
                <line x1="4" x2="20" y1="12" y2="12" />
                <line x1="4" x2="20" y1="18" y2="18" />
              </svg>
            </button>
            <div class="width-control">
              <span class="width-label" id="widthLabel">70%</span>
              <input
                type="range"
                id="widthSlider"
                class="width-slider"
                min="50"
                max="100"
                value="70"
                step="5"
                title="调节预览宽度"
              />
            </div>
          </div>
          <div class="preview-wrapper">
            <div id="toc" class="toc hidden">
              <div class="toc-header">
                <span class="toc-title">目录</span>
                <button class="toc-close" id="tocClose">&times;</button>
              </div>
              <div class="toc-content" id="tocContent"></div>
            </div>
            <div id="preview" class="preview"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Template Modal -->
    <div id="templateModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>选择模板</h2>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="template-list" id="templateList"></div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
