<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown 在线预览</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>"
    />
    <link rel="stylesheet" href="css/style.css" />
    <!-- 代码高亮样式 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <!-- Markdown 解析 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <!-- Mermaid 图表渲染 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.0/mermaid.min.js"></script>
    <!-- 代码高亮 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- 数据压缩（LZString） -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <!-- 预设模板 -->
    <script src="templates/examples.js"></script>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <h1 class="logo">📝 Markdown 在线预览</h1>
        </div>
        <div class="header-right">
          <button class="btn btn-secondary" id="modeToggle" title="切换模式">
            <span class="icon">👁️</span> <span id="modeText">预览</span>
          </button>
          <button class="btn btn-secondary" id="themeToggle" title="切换主题">
            <span class="icon">☀️</span>
          </button>
          <button
            class="btn btn-secondary"
            id="loadTemplate"
            title="加载示例模板"
          >
            <span class="icon">📋</span> 模板
          </button>
          <button class="btn btn-secondary" id="clearBtn" title="清空内容">
            <span class="icon">🗑️</span> 清空
          </button>
          <button class="btn btn-secondary" id="exportHtml" title="导出 HTML">
            <span class="icon">📄</span> 导出 HTML
          </button>
          <button
            class="btn btn-primary"
            id="shareLink"
            title="生成并复制分享链接"
          >
            <span class="icon">🔗</span> 分享链接
          </button>
        </div>
      </header>

      <!-- Main Content -->
      <main class="main">
        <!-- Editor -->
        <div class="editor-container">
          <div class="panel-header">
            <span class="panel-title">编辑器</span>
            <span class="char-count" id="charCount">0 字符</span>
          </div>
          <div class="editor-wrapper">
            <div class="line-numbers" id="lineNumbers"></div>
            <textarea
              id="editor"
              class="editor"
              placeholder="在此输入 Markdown 内容..."
              spellcheck="false"
            ></textarea>
          </div>
        </div>

        <!-- Preview -->
        <div class="preview-container">
          <div class="panel-header">
            <span class="panel-title">预览</span>
          </div>
          <div id="preview" class="preview"></div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <div class="footer-info">
          <span>快捷键: Ctrl+S 保存到本地 | Ctrl+Enter 刷新预览</span>
        </div>
      </footer>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <!-- Template Modal -->
    <div id="templateModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>选择模板</h2>
          <button class="modal-close" id="closeModal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="template-list" id="templateList"></div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
